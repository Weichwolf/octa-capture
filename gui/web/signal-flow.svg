<!-- Independently drawn functional schematic; no manufacturer artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="945" height="500" viewBox="0 0 945 500" role="img" aria-labelledby="title description">
  <title id="title">OCTA-CAPTURE signal flow</title>
  <desc id="description">Eight analog inputs pass through sensitivity, conversion, phase, high-pass filtering and compression.
    USB audio feeds four direct mixers, combining input and computer playback. Mixer A has reverb.
    Patchbay sources feed the analog and coaxial outputs; MIDI passes separately between USB and the DIN ports.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#383838"/>
    </marker>
    <g id="analog-input">
      <circle cx="46" cy="0" r="7"/><circle cx="46" cy="0" r="3"/>
      <path d="M53 0H97M118 0H124M145 0H151M172 0H178M199 0H205M226 0H302"/>
      <g fill="white"><rect x="97" y="-10" width="21" height="20"/><rect x="124" y="-10" width="21" height="20"/>
        <rect x="151" y="-10" width="21" height="20"/><rect x="178" y="-10" width="21" height="20"/>
        <rect x="205" y="-10" width="21" height="20"/></g>
      <g stroke="none" fill="#282828" font-size="6.5" text-anchor="middle">
        <text x="107.5" y="2">SENS</text><text x="134.5" y="2">A/D</text><text x="161.5" y="2">PHASE</text>
        <text x="188.5" y="-1">HPF</text><text x="188.5" y="6">100 Hz</text><text x="215.5" y="2">COMP</text>
      </g>
    </g>
    <g id="input-hiz">
      <use href="#analog-input"/>
      <rect x="70" y="-10" width="21" height="20" fill="white"/>
      <g stroke="none" fill="#282828" font-size="6.5" text-anchor="middle"><text x="80.5" y="-1">Hi-Z/</text><text x="80.5" y="6">Lo-Z</text></g>
    </g>
    <g id="output-pair">
      <path d="M760 0H766M789 0H850V-11H857M850 0V11H857"/>
      <rect x="766" y="-10" width="23" height="20" fill="white"/>
      <circle cx="863" cy="-11" r="5"/><circle cx="863" cy="11" r="5"/>
      <circle cx="863" cy="-11" r="2.5"/><circle cx="863" cy="11" r="2.5"/>
      <text x="777.5" y="2.5" stroke="none" fill="#282828" font-size="7" text-anchor="middle">D/A</text>
    </g>
    <g id="mixer-frame"><rect x="0" y="0" width="159" height="252" fill="white"/></g>
  </defs>
  <rect width="945" height="500" fill="white"/>
  <g fill="none" stroke="#57524f" stroke-width=".8">
