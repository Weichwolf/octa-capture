    <use href="#mixer-frame" x="558" y="38"/><use href="#mixer-frame" x="553" y="33"/>
    <use href="#mixer-frame" x="548" y="28"/><use href="#mixer-frame" x="543" y="23"/>
    <rect x="549" y="38" width="97" height="94"/>
