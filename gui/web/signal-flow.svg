    <text x="314" y="364">IN 7/8</text><text x="365" y="364">OUT 7/8</text>
    <text x="314" y="410">DIGITAL</text><text x="365" y="410">DIGITAL</text>
    <text x="314" y="419">IN 9/10</text><text x="365" y="419">OUT 9/10</text>
    <text x="314" y="447">IN</text><text x="358" y="441" text-anchor="middle" font-size="11">MIDI</text><text x="381" y="447">OUT</text>
    <text x="358" y="486" text-anchor="middle" font-size="12">HI-SPEED USB</text>
    <text x="549" y="35" font-size="10">DIRECT MIXER A</text>
    <text x="597" y="68" text-anchor="middle" font-size="10">INPUT MIXER A</text>
    <text x="673" y="51" font-size="7" font-weight="normal">INPUT</text><text x="680" y="59" font-size="7" font-weight="normal">MIX</text>
    <text x="560" y="111" font-size="10">Reverb</text><text x="560" y="124" font-size="8" font-weight="normal">Only INPUT MIXER A</text>
    <text x="597" y="174" text-anchor="middle" font-size="10">OUTPUT MIXER A</text>
    <text x="548" y="270">MIXER A</text><text x="590" y="275">MIXER B</text>
    <text x="635" y="280">MIXER C</text><text x="677" y="285">MIXER D</text>
    <text x="747" y="256" transform="rotate(90 747 256)" font-size="11">PATCHBAY</text>
    <text x="874" y="120">PHONES</text><text x="874" y="147">OUTPUT 1</text><text x="874" y="169">OUTPUT 2</text>
    <text x="800" y="188" font-size="7" font-weight="normal">PHONES + MAIN</text><text x="800" y="197" font-size="7" font-weight="normal">PHONES</text>
    <text x="874" y="214">OUTPUT 3</text><text x="874" y="236">OUTPUT 4</text>
    <text x="874" y="280">OUTPUT 5</text><text x="874" y="302">OUTPUT 6</text>
