    <rect x="766" y="145" width="23" height="20" fill="white"/>
    <rect x="825" y="145" width="21" height="20" fill="white"/>
    <circle cx="863" cy="144" r="5"/><circle cx="863" cy="166" r="5"/><circle cx="863" cy="117" r="5"/>
    <path d="M51 409H308M760 409H858"/><circle cx="46" cy="409" r="5"/><circle cx="46" cy="409" r="2.5"/>
    <circle cx="863" cy="409" r="5"/><circle cx="863" cy="409" r="2.5"/>
    <path d="M53 443H308M408 443H856"/><circle cx="46" cy="443" r="7"/><circle cx="863" cy="443" r="7"/>
    <rect x="308" y="464" width="100" height="33" stroke="#282828" stroke-width="1.5"/>
    <path d="M358 455V470" stroke="#282828" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g fill="#282828" font-family="Arial, Liberation Sans, sans-serif" font-weight="bold" font-size="8">
    <text x="4" y="146">INPUT 1</text><text x="4" y="179">INPUT 2</text><text x="4" y="212">INPUT 3</text>
    <text x="54" y="107">+48V</text>
